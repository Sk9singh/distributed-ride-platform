services:
  postgres:
    image: postgres:16-alpine
    container_name: ride-postgres
    environment:
      # Superuser, used only for admin work (psql, creating roles). Services never use it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run ONCE, only when the data volume is empty.
      # After editing them: `docker compose down -v` to wipe and re-init.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
